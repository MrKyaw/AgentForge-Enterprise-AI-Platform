name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Tests with coverage
        run: python -m pytest -q --cov=agentforge --cov-report=term-missing --cov-fail-under=85

      - name: Golden evaluation
        run: |
          rm -f var/eval.db
          AGENTFORGE_DB_PATH=var/eval.db agentforge eval --fail-under 1.0

      - name: Package build
        run: |
          python -m pip install build
          python -m build

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t agentforge:ci .
      - name: Smoke test
        run: |
          docker run -d --name agentforge -p 8000:8000 agentforge:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz >/dev/null; then echo "healthy"; exit 0; fi
            sleep 1
          done
          echo "not healthy"; docker logs agentforge; exit 1
