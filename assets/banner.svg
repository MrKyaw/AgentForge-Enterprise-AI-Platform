<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">AgentForge Enterprise AI Platform</title>
  <desc id="desc">Governed enterprise AI control plane: hybrid RAG, agent runtime, model gateway, approvals, audit, and evaluation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0a1a2c"/>
      <stop offset="1" stop-color="#060e19"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8fa8c2" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <rect x="64" y="58" width="72" height="72" rx="20" fill="url(#mark)"/>
    <text x="100" y="106" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#04111a">A</text>
  </g>

  <text x="160" y="92" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#e8f1fb" letter-spacing="-1">AgentForge</text>
  <text x="162" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#5eead4" letter-spacing="3">ENTERPRISE AI CONTROL PLANE</text>

  <text x="64" y="200" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e8f1fb">AI that ships with evidence, not just answers.</text>
  <text x="64" y="232" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#8fa8c2">Grounded agents · hybrid RAG · model gateway · human approvals · hash-chained audit · FinOps · evaluation</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">
    <rect x="64" y="258" width="146" height="30" rx="15" fill="#102139" stroke="#8fa8c2" stroke-opacity="0.18"/>
    <text x="137" y="277" text-anchor="middle" fill="#bfd4e8">OFFLINE DEMO</text>
    <rect x="222" y="258" width="118" height="30" rx="15" fill="#102139" stroke="#8fa8c2" stroke-opacity="0.18"/>
    <text x="281" y="277" text-anchor="middle" fill="#bfd4e8">FASTAPI</text>
    <rect x="352" y="258" width="112" height="30" rx="15" fill="#102139" stroke="#8fa8c2" stroke-opacity="0.18"/>
    <text x="408" y="277" text-anchor="middle" fill="#bfd4e8">PYTHON 3.11+</text>
    <rect x="476" y="258" width="104" height="30" rx="15" fill="#102139" stroke="#8fa8c2" stroke-opacity="0.18"/>
    <text x="528" y="277" text-anchor="middle" fill="#bfd4e8">MIT</text>
  </g>

  <g transform="translate(860 66)">
    <rect width="276" height="188" rx="18" fill="#0b1a2d" stroke="#8fa8c2" stroke-opacity="0.16"/>
    <text x="20" y="32" font-family="ui-monospace, Menlo, monospace" font-size="11" font-weight="700" fill="#8fa8c2" letter-spacing="2">REQUEST PATH</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="12">
      <rect x="20" y="46" width="236" height="30" rx="8" fill="#07111f" stroke="#8fa8c2" stroke-opacity="0.10"/>
      <text x="32" y="65" fill="#bfd4e8">01 identity</text><text x="176" y="65" fill="#5eead4">tenant + role</text>
      <rect x="20" y="82" width="236" height="30" rx="8" fill="#07111f" stroke="#8fa8c2" stroke-opacity="0.10"/>
      <text x="32" y="101" fill="#bfd4e8">02 policy</text><text x="176" y="101" fill="#5eead4">injection / PII</text>
      <rect x="20" y="118" width="236" height="30" rx="8" fill="#07111f" stroke="#8fa8c2" stroke-opacity="0.10"/>
      <text x="32" y="137" fill="#bfd4e8">03 retrieval</text><text x="176" y="137" fill="#5eead4">vector + BM25</text>
      <rect x="20" y="154" width="236" height="30" rx="8" fill="#07111f" stroke="#8fa8c2" stroke-opacity="0.10"/>
      <text x="32" y="173" fill="#bfd4e8">04 evidence</text><text x="176" y="173" fill="#5eead4">citations + audit</text>
    </g>
  </g>
</svg>
