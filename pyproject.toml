[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agentforge-enterprise-ai-platform"
version = "1.0.0"
description = "Governed enterprise AI control plane: RAG, agent runtime, model gateway, observability, approvals, and evaluation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "MrKyaw" }]
keywords = [
  "enterprise-ai",
  "ai-agents",
  "rag",
  "llm-gateway",
  "ai-governance",
  "llmops",
  "evaluation",
  "fastapi",
  "azure",
  "databricks",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: FastAPI",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]

[project.scripts]
agentforge = "agentforge.cli:main"

[project.urls]
Homepage = "https://github.com/MrKyaw/AgentForge-Enterprise-AI-Platform"
Documentation = "https://github.com/MrKyaw/AgentForge-Enterprise-AI-Platform/tree/main/docs"
Issues = "https://github.com/MrKyaw/AgentForge-Enterprise-AI-Platform/issues"
Changelog = "https://github.com/MrKyaw/AgentForge-Enterprise-AI-Platform/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "data", "docs", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "slow: end-to-end tests that exercise the full demo workflow",
]
filterwarnings = ["error::DeprecationWarning:agentforge.*"]

[tool.coverage.run]
source = ["src/agentforge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"
